name: tests
# Unit tests for the data pipeline (expense-ratio cache, bundle check, REIT/InvIT classification). Made-up data only.
on:
  push:
    paths: ["build/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python3 -m unittest discover -s tests
