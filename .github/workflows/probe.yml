name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: find AMFI TER api
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          mkdir -p /tmp/a && cd /tmp/a
          curl -sS -L -A "$UA" https://www.amfiindia.com/ter-of-mf-schemes -o page.html
          grep -oE '/_next/static/chunks/[A-Za-z0-9_./-]+\.js' page.html | sort -u > chunks.txt
          wc -l chunks.txt
          while read c; do curl -sS -A "$UA" "https://www.amfiindia.com$c" -o "$(echo $c | tr '/' '_')" ; done < chunks.txt
          echo "--- api-ish strings in chunks"
          grep -ohE '"[^"]{0,80}(/api/|api\.|amfiapi|/ter|TER|expense|Expense)[^"]{0,100}"' *.js | sort -u | head -80
          echo "--- in page html"
          grep -ohE '[A-Za-z0-9_.:/-]*(api|Api)[A-Za-z0-9_./?=&-]*' page.html | sort -u | head -40
