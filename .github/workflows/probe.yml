name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: find AMFI TER api
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          mkdir -p /tmp/a && cd /tmp/a
          curl -sS -L -A "$UA" https://www.amfiindia.com/ter-of-mf-schemes -o page.html
          grep -oE '/_next/static/chunks/[A-Za-z0-9_./-]+\.js' page.html | sort -u > chunks.txt
          wc -l chunks.txt
          while read c; do curl -sS -A "$UA" "https://www.amfiindia.com$c" -o "$(echo $c | tr '/' '_')" ; done < chunks.txt
          B=https://www.amfiindia.com/api
          for y in 2024 2025 2026 2025-2026 2026-2027 2025-26 2026-27; do echo "== month year=$y"; curl -sS -m 60 -A "$UA" "$B/populate-ter-month?year=$y" | head -c 500; echo; done
          echo "--- year options ctx"
          grep -ohE '.{200}(yearOptions|years|FinancialYear|finYear).{300}' *.js | head -3
          echo "--- mf list / category"
          curl -sS -m 60 -A "$UA" "$B/populate-sub-category?type=1" | head -c 600; echo
          for m in 10 9 8; do for yr in 2026; do echo "== data Month=$m"; curl -sS -m 90 -A "$UA" "$B/populate-te-rdata-revised?MF_ID=All&Month=$m&strCat=-1&strType=-1&page=1&pageSize=3" | head -c 1500; echo; done; done
