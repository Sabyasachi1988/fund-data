name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: find AMFI TER api
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          mkdir -p /tmp/a && cd /tmp/a
          curl -sS -L -A "$UA" https://www.amfiindia.com/ter-of-mf-schemes -o page.html
          grep -oE '/_next/static/chunks/[A-Za-z0-9_./-]+\.js' page.html | sort -u > chunks.txt
          wc -l chunks.txt
          while read c; do curl -sS -A "$UA" "https://www.amfiindia.com$c" -o "$(echo $c | tr '/' '_')" ; done < chunks.txt
          echo "--- context"
          grep -ohE '.{600}populate-te-rdata-revised.{700}' *.js | head -3
          echo "--- month ctx"
          grep -ohE '.{300}populate-ter-month.{300}' *.js | head -2
          echo "--- tries"
          B=https://www.amfiindia.com/api
          for u in "populate-ter-month?year=2026" "populate-te-rdata-revised?MF_ID=3&strCat=-1&strType=-1&MonthTER=10-2026" "populate-te-rdata-revised?MF_ID=-1" ; do echo "== $u"; curl -sS -m 60 -A "$UA" "$B/$u" | head -c 700; echo; done
