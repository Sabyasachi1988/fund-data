name: monthly
# Adds the newest month-end cap and sector splits. Public repo: runner minutes are free.
# Uploads no Actions artifacts (artifact storage is not used).
on:
  schedule:
    - cron: "15 6 16 * *"   # 16th of each month, after funds' 10-day disclosure deadline
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monthly
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: build/sync_archive.sh
      - run: python3 build/publish.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data pub
          git diff --staged --quiet && echo "no changes" || (git commit -m "Add monthly splits" && git push)
