name: backfill-probe
# Probe: fetch and parse one past month of AMC portfolio disclosures with the open fund-disclosures toolkit
# (MIT) and report how many AMCs/files/schemes came through. Public repo: runner minutes are free.
# No Actions artifacts are uploaded; results are written to the job log and to probe/<period>.json.
on:
  workflow_dispatch:
    inputs:
      period:
        description: "Month to probe, YYYY-MM"
        required: true
        default: "2025-12"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get toolkit
        run: |
          git clone -q --depth 1 https://github.com/subscriptionmanager26-png/fund-disclosures /tmp/fd
          cd /tmp/fd
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          (npm ci --omit=dev || npm install --omit=dev) 2>&1 | tail -2
      - name: Fetch
        continue-on-error: true
        run: |
          cd /tmp/fd
          npm run fetch -- --type=monthly --period=${{ inputs.period }} > /tmp/fetch.log 2>&1 || true
          tail -150 /tmp/fetch.log
          echo "--- files fetched:"
          find data/disclosures -type f | wc -l
          find data/disclosures -type f | head -80
          du -sh data/disclosures
      - name: Parse
        continue-on-error: true
        run: |
          cd /tmp/fd
          npm run parse:amc -- --type=monthly --period=${{ inputs.period }} > /tmp/parse.log 2>&1 || true
          tail -150 /tmp/parse.log
          echo "--- parsed:"
          find data/parsed -type f | wc -l
          du -sh data/parsed
          find data/parsed -type f | head -40
      - name: Save summary to repo
        if: always()
        run: |
          mkdir -p probe
          {
            echo "period ${{ inputs.period }}"
            echo "== fetch log (last 200 lines)"; tail -200 /tmp/fetch.log || true
            echo "== files fetched"; find /tmp/fd/data/disclosures -type f | wc -l; du -sh /tmp/fd/data/disclosures || true
            find /tmp/fd/data/disclosures -type f | sed 's#/tmp/fd/data/disclosures/##' | head -150
            echo "== parse log (last 200 lines)"; tail -200 /tmp/parse.log || true
            echo "== parsed"; find /tmp/fd/data/parsed -type f | wc -l; du -sh /tmp/fd/data/parsed || true
            find /tmp/fd/data/parsed -type f | sed 's#/tmp/fd/data/parsed/##' | head -100
          } > probe/${{ inputs.period }}.txt 2>&1
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "Probe result ${{ inputs.period }}" && git push
