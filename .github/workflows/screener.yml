name: screener
# Builds the all-funds screener bundle (every open-ended Direct-Growth scheme: metrics + daily NAV history), checks it,
# and publishes it to the `screener-data` branch (one commit, overwritten each run; the app downloads from there).
# Then saves the expense-ratio cache so the next run only has to fetch the current month.
on:
  schedule:
    - cron: "40 7 20 * *"   # 20th of each month, after the monthly fund-data job
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: screener
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python3 -m unittest discover -s tests
      - run: python3 build/screener.py /tmp/screener
      - run: python3 build/enrich.py /tmp/screener
      - name: Check and publish (a failed check stops here and leaves the live data alone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/publish_bundle.sh /tmp/screener
      - name: Save the expense-ratio cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ter_cache.json
          git diff --staged --quiet && echo "cache unchanged" || (git commit -m "Update expense-ratio cache" && git pull -q --rebase && git push)
