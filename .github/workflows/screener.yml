name: screener
# Builds the all-funds screener bundle (every open-ended Direct-Growth scheme: metrics + weekly NAV history) and
# commits it to pub/screener (the app downloads it from there). Public repo: free minutes.
on:
  schedule:
    - cron: "40 7 20 * *"   # 20th of each month, after the monthly fund-data job
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: screener
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build/screener.py /tmp/screener
      - run: python3 build/enrich.py /tmp/screener
      - name: Publish (commit to pub/screener, which the app downloads from)
        run: |
          mkdir -p pub/screener
          cp /tmp/screener/screener.json.gz /tmp/screener/navd.json.gz pub/screener/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pub/screener
          git diff --staged --quiet && echo "no changes" || (git commit -m "Update screener bundle" && git pull -q --rebase && git push)
