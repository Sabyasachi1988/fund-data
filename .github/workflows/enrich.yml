name: enrich
# Adds expense ratio, fund size and category-relative risk metrics to the published screener bundle (no NAV refetch).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download current bundle
        run: |
          mkdir -p /tmp/screener
          for f in screener.json.gz navd.json.gz; do curl -sSL -o /tmp/screener/$f https://github.com/${{ github.repository }}/releases/download/screener/$f; done
          ls -l /tmp/screener
      - run: python3 build/enrich.py /tmp/screener
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload screener /tmp/screener/screener.json.gz /tmp/screener/navd.json.gz --clobber
