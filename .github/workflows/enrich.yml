name: enrich
# Adds expense ratio, fund size and category-relative risk metrics to the published screener bundle (no NAV refetch).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use the current bundle
        run: |
          mkdir -p /tmp/screener
          cp pub/screener/screener.json.gz pub/screener/navd.json.gz /tmp/screener/
          ls -l /tmp/screener
      - run: python3 build/enrich.py /tmp/screener
      - name: Publish
        run: |
          cp /tmp/screener/screener.json.gz /tmp/screener/navd.json.gz pub/screener/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pub/screener
          git diff --staged --quiet && echo "no changes" || (git commit -m "Enrich screener bundle" && git pull -q --rebase && git push)
